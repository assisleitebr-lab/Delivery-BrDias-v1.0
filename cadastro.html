<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cadastro | Delivery</title><link rel="stylesheet" href="css/style.css"></head><body class="auth-page"><a class="back-link" href="index.html">← Voltar à loja</a><main class="auth-shell"><section class="auth-promo"><span class="brand-mark">D</span><span class="eyebrow">FAÇA PARTE</span><h1>SEU SABOR<br><em>COMEÇA AQUI.</em></h1><p>Crie sua conta para pedir seus lanches favoritos com mais praticidade.</p></section><section class="auth-card"><h2>Criar conta</h2><p class="muted">Preencha seus dados.</p><form id="signupForm"><label>Nome completo<input id="name" required autocomplete="name"></label><label>Telefone / WhatsApp<input id="phone" required autocomplete="tel"></label><label>E-mail<input id="email" type="email" required autocomplete="email"></label><label>Senha<input id="password" type="password" minlength="8" required autocomplete="new-password"></label><label>Endereço<input id="address" required autocomplete="street-address"></label><div class="form-grid"><label>Número<input id="number" required></label><label>Bairro<input id="neighborhood" required></label></div><label>Ponto de referência<input id="reference"></label><button class="btn btn-red full" type="submit">CRIAR MINHA CONTA</button><p id="message" class="form-message" role="status"></p></form><p class="muted center">Já tem cadastro? <a href="login.html" class="inline-link">Entrar</a></p></section></main><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script><script src="js/config.js"></script><script src="js/auth.js"></script></body></html>
